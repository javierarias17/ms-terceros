name: Deploy backend a Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write   # necesario para el login OIDC sin guardar un secreto de service principal
  contents: read

concurrency:
  group: deploy-container-apps
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}   # solo el nombre, sin ".azurecr.io"
  CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
  IMAGE_NAME: ms-tercero

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar (bootJar)
        run: ./gradlew :application:app-service:bootJar --no-daemon

      - name: Login en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login en el registro de contenedores
        run: az acr login --name "$AZURE_CONTAINER_REGISTRY"

      - name: Build y push de la imagen (Docker local; ACR Tasks no está permitido en esta suscripción)
        run: |
          docker build \
            -t "$AZURE_CONTAINER_REGISTRY.azurecr.io/$IMAGE_NAME:${{ github.sha }}" \
            -t "$AZURE_CONTAINER_REGISTRY.azurecr.io/$IMAGE_NAME:latest" \
            .
          docker push "$AZURE_CONTAINER_REGISTRY.azurecr.io/$IMAGE_NAME:${{ github.sha }}"
          docker push "$AZURE_CONTAINER_REGISTRY.azurecr.io/$IMAGE_NAME:latest"

      - name: Desplegar en Container Apps
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$AZURE_CONTAINER_REGISTRY.azurecr.io/$IMAGE_NAME:${{ github.sha }}"

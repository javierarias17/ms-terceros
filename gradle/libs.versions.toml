[versions]
spring-boot = "4.1.0"
spring-dependency-management = "1.1.7"
lombok = "1.18.38"
mapstruct = "1.5.5.Final"
jakarta-validation = "3.0.2"
reactor-bom = "2023.0.11"
junit-jupiter = "5.10.3"
reactor-test = "3.6.11"
slf4j = "2.0.13"
springdoc = "3.0.3"
mockito = "5.11.0"
assertj = "3.27.7"
lang3 = "3.20.0"
azure-storage-blob = "12.36.0"
r2dbc-postgresql = "0.8.13.RELEASE"

[libraries]
# Spring Boot
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

# Spring Framework (non-boot)
spring-webflux = { module = "org.springframework:spring-webflux" }
spring-context = { module = "org.springframework:spring-context" }
spring-web = { module = "org.springframework:spring-web" }

# Reactor
reactor-bom = { module = "io.projectreactor:reactor-bom", version.ref = "reactor-bom" }
reactor-core = { module = "io.projectreactor:reactor-core" }
reactor-test = { module = "io.projectreactor:reactor-test", version.ref = "reactor-test" }

# Lombok
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# commons-lang3
lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "lang3" }

# MapStruct
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }

# Jakarta
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakarta-validation" }

# Jackson (version managed by the Spring Boot BOM, no explicit pin needed)
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }

# Springdoc / OpenAPI
springdoc-openapi-webflux-ui = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }

# Azure Blob Storage
azure-storage-blob = { module = "com.azure:azure-storage-blob", version.ref = "azure-storage-blob" }

# R2DBC (versions managed by the Spring Boot BOM)
spring-boot-starter-data-r2dbc = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc" }
r2dbc-postgresql = { module = "io.r2dbc:r2dbc-postgresql", version.ref = "r2dbc-postgresql" }

# Testing
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

# Logging
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

[bundles]
spring-webflux = ["spring-boot-starter-webflux", "spring-boot-starter-validation", "spring-boot-starter-actuator"]
testing = ["junit-jupiter", "reactor-test", "spring-boot-starter-test"]
mockito = ["mockito-core", "mockito-junit-jupiter"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

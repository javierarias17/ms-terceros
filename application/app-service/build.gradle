// ─────────────────────────────────────────────────────────────
// application:app-service — Spring Boot application assembly
// ─────────────────────────────────────────────────────────────

apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

bootJar {
    enabled = true
    archiveBaseName.set('ms-tercero')
    archiveVersion.set('0.0.1-SNAPSHOT')
}

jar {
    enabled = false
}

dependencies {
    // Domain
    implementation project(':domain:model')
    implementation project(':domain:ports')
    implementation project(':domain:usecases')

    // Infrastructure — Driven Adapters
    implementation project(':infrastructure:driven-adapters:rest-services:example-client-api')

    // Infrastructure — Entry Points
    implementation project(':infrastructure:entry-points:reactive-web')

    // Spring Boot starters
    implementation libs.bundles.spring.webflux
}
